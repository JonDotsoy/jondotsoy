<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Un solo archivo para los .env de todos tus git worktrees</title>
  <desc id="cover-desc">Diagrama: un archivo central .envs/values.yml distribuye, mediante flechas, los archivos .env a tres git worktrees llamados main, feature-x y feature/biz. Debajo del título, un bloque de terminal muestra el comando bunx @jondotsoy/envs edit.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2029" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f2b54b"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="#0f1115"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Columna de texto -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#9aa3b2">
    <text x="64" y="92">git worktree · .env · @jondotsoy/envs</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="46" fill="#eef0f3">
    <text x="64" y="170">Un solo archivo para</text>
    <text x="64" y="228">los <tspan fill="#f2b54b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">.env</tspan> de todos tus</text>
    <text x="64" y="286">git worktrees</text>
  </g>

  <!-- Terminal -->
  <g>
    <rect x="64" y="360" width="500" height="118" rx="12" fill="#161a21" stroke="#2c323d"/>
    <path d="M64 372a12 12 0 0 1 12-12h476a12 12 0 0 1 12 12v22H64z" fill="#1d222b"/>
    <line x1="64" y1="394" x2="564" y2="394" stroke="#2c323d"/>
    <circle cx="86" cy="377" r="5.5" fill="#3a414e"/>
    <circle cx="104" cy="377" r="5.5" fill="#3a414e"/>
    <circle cx="122" cy="377" r="5.5" fill="#3a414e"/>
    <text x="314" y="382" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9aa3b2">~/mi-proyecto</text>
    <text x="88" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#eef0f3"><tspan fill="#5ec8b8">$</tspan> bunx @jondotsoy/envs edit</text>
  </g>

  <text x="64" y="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9aa3b2">Un archivo, un comando, todos los worktrees.</text>

  <!-- Conectores -->
  <g fill="none" stroke="#f2b54b" stroke-width="2.5" stroke-linecap="round">
    <path d="M840 315C884 315 872 165 914 165" marker-end="url(#arrow)"/>
    <path d="M840 315H914" marker-end="url(#arrow)"/>
    <path d="M840 315C884 315 872 465 914 465" marker-end="url(#arrow)"/>
  </g>
  <circle cx="840" cy="315" r="6" fill="#f2b54b"/>

  <!-- Nodo central: values.yml -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <rect x="620" y="240" width="220" height="150" rx="14" fill="#1d1a12" stroke="#f2b54b" stroke-width="2"/>
    <text x="644" y="276" font-size="16" fill="#9aa3b2">.envs/</text>
    <text x="644" y="310" font-size="26" font-weight="700" fill="#f2b54b">values.yml</text>
    <text x="644" y="344" font-size="15" fill="#c9ced6">DATABASE_URL:</text>
    <text x="644" y="368" font-size="15" fill="#c9ced6">PORT:</text>
  </g>

  <!-- Worktrees -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <!-- main -->
    <g transform="translate(916 120)">
      <rect width="220" height="90" rx="12" fill="#121c1c" stroke="#5ec8b8" stroke-width="2"/>
      <g stroke="#5ec8b8" stroke-width="2" fill="none">
        <circle cx="24" cy="26" r="4"/><circle cx="24" cy="46" r="4"/><circle cx="36" cy="30" r="4"/>
        <path d="M24 30V42M36 34C36 40 30 40 25 43"/>
      </g>
      <text x="50" y="42" font-size="20" font-weight="700" fill="#5ec8b8">main</text>
      <rect x="18" y="56" width="62" height="24" rx="6" fill="#0f1115" stroke="#2c323d"/>
      <text x="49" y="73" text-anchor="middle" font-size="15" fill="#eef0f3">.env</text>
    </g>
    <!-- feature-x -->
    <g transform="translate(916 270)">
      <rect width="220" height="90" rx="12" fill="#121c1c" stroke="#5ec8b8" stroke-width="2"/>
      <g stroke="#5ec8b8" stroke-width="2" fill="none">
        <circle cx="24" cy="26" r="4"/><circle cx="24" cy="46" r="4"/><circle cx="36" cy="30" r="4"/>
        <path d="M24 30V42M36 34C36 40 30 40 25 43"/>
      </g>
      <text x="50" y="42" font-size="20" font-weight="700" fill="#5ec8b8">feature-x</text>
      <rect x="18" y="56" width="62" height="24" rx="6" fill="#0f1115" stroke="#2c323d"/>
      <text x="49" y="73" text-anchor="middle" font-size="15" fill="#eef0f3">.env</text>
    </g>
    <!-- feature/biz -->
    <g transform="translate(916 420)">
      <rect width="220" height="90" rx="12" fill="#121c1c" stroke="#5ec8b8" stroke-width="2"/>
      <g stroke="#5ec8b8" stroke-width="2" fill="none">
        <circle cx="24" cy="26" r="4"/><circle cx="24" cy="46" r="4"/><circle cx="36" cy="30" r="4"/>
        <path d="M24 30V42M36 34C36 40 30 40 25 43"/>
      </g>
      <text x="50" y="42" font-size="20" font-weight="700" fill="#5ec8b8">feature/biz</text>
      <rect x="18" y="56" width="62" height="24" rx="6" fill="#0f1115" stroke="#2c323d"/>
      <text x="49" y="73" text-anchor="middle" font-size="15" fill="#eef0f3">.env</text>
    </g>
  </g>
</svg>
